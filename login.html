<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Online Auction</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->

    <nav>

        <h2>Online Auction</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="products.html">Auctions</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- Login -->

    <section class="auth-section">

        <div class="auth-box">

            <h1>Welcome Back</h1>

            <p>Login to participate in auctions.</p>


            <form>

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="auth-link">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </section>


    <footer>

        <p>© 2026 Online Auction System</p>

    </footer>

</body>

</html>
